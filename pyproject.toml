[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generator module (A-Maze-ing — 42)"
readme = "README_MAZEGEN.md"
requires-python = ">=3.10"
authors = [
    { name = "acaldeir" },
    { name = "rusilva-" }
]
license = "MIT"

[tool.setuptools]
py-modules = ["mazegen"]
